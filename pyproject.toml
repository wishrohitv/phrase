[project]
name = "phrase-backend"
version = "0.1.0"
authors = [
    { name = "wishrohitv", email = "wishrohitv@outlook.com" }
]
description = "backend for Phrase"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "bcrypt>=5.0.0",
    "brevo-python>=5.1.0",
    "celery>=5.7.0",
    "dodopayments[aiohttp]>=1.127.0",
    "fastapi-redis-sdk>=0.9.1",
    "fastapi[standard]>=0.159.1",
    "httpx>=0.27.0",
    "openrouter>=1.3.76",
    "packaging>=26.3",
    "pgvector>=0.5.1",
    "psycopg-binary>=3.3.6",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = [".", "src"]
